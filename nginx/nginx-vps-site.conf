# ══════════════════════════════════════════════════════════════════════════════
# Hostinger VPS Nginx Config — Property Finder App
#
# HOW TO USE:
#   1. Copy this file to: /etc/nginx/sites-available/property-finder
#   2. Replace YOUR_DOMAIN with your actual domain (e.g. property.example.com)
#   3. Run: sudo ln -s /etc/nginx/sites-available/property-finder /etc/nginx/sites-enabled/
#   4. Run: sudo nginx -t && sudo systemctl reload nginx
#   5. Get SSL: sudo certbot --nginx -d YOUR_DOMAIN
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # ── API Backend (FastAPI on port 8001) ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:8001;
        proxy_http_version 1.1;

        # ─── SSE Streaming — MUST have these or live results won't work ────────
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        # ───────────────────────────────────────────────────────────────────────

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://localhost:8001/health;
    }

    # ── React Frontend (Nginx on port 3001) ────────────────────────────────────
    location / {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# NOTE: After running certbot, it will automatically add the SSL (443) block below this.
